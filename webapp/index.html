<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tiến Lên Miền Nam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="screen-login" class="screen active">
    <div class="login-bg">
      <div class="login-logo">
        <div class="logo-cards">
          <span class="logo-card c1">2♠</span>
          <span class="logo-card c2">2♣</span>
          <span class="logo-card c3">2♦</span>
          <span class="logo-card c4">2♥</span>
        </div>
        <h1 class="logo-title">Tiến Lên</h1>
        <p class="logo-subtitle">Miền Nam</p>
      </div>
      <div class="login-buttons">
        <button class="btn-play" onclick="startGuest()">
          <span class="btn-icon">👤</span> Chơi Ngay
        </button>
      </div>
      <div class="login-footer">
        <label><input type="checkbox" checked> Tôi đã đọc và đồng ý <a href="#">điều khoản dịch vụ</a></label>
      </div>
      <div class="version-info">TLWEB V1.0</div>
    </div>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-header">
      <div class="user-info">
        <div class="avatar" id="lobby-avatar">👤</div>
        <span class="username" id="lobby-username">Player</span>
      </div>
      <div class="currency-bar">
        <div class="currency gold">
          <span class="currency-icon">🪙</span>
          <span id="lobby-gold">10,000,000</span>
        </div>
        <div class="currency diamond">
          <span class="currency-icon">💎</span>
          <span id="lobby-diamond">0</span>
        </div>
      </div>
      <button class="btn-settings" onclick="showSettings()">⚙️</button>
    </div>
    <div class="lobby-body">
      <div class="lobby-character"></div>
      <div class="lobby-modes">
        <button class="mode-card mode-gold" onclick="showRooms('demla')">
          <div class="mode-cards-fan">
            <span>2♠</span><span>2♣</span><span>2♦</span><span>2♥</span>
          </div>
          <div class="mode-label">KHU VÀNG</div>
        </button>
        <div class="mode-side-buttons">
          <button class="btn-create-room" onclick="createRoom()">
            <span>⭐</span>
            <div>TẠO PHÒNG</div>
          </button>
          <button class="btn-join-room" onclick="joinRoom()">
            <span>🤝</span>
            <div>VÀO PHÒNG</div>
          </button>
        </div>
      </div>
    </div>
    <div class="lobby-bottom-bar">
      <button class="bottom-btn" onclick="showShop()">🏪<br>Shop</button>
      <button class="bottom-btn">⭐<br>VIP</button>
      <button class="bottom-btn">✉️<br>Mail</button>
      <button class="bottom-btn">🎁<br>Quà</button>
      <button class="bottom-btn">👤<br>Hồ sơ</button>
      <button class="bottom-btn">👥<br>Bạn bè</button>
      <button class="bottom-btn quick-start" onclick="quickStart()">BẮT ĐẦU NHANH ▶</button>
    </div>
  </div>

  <!-- ROOM SELECTION SCREEN -->
  <div id="screen-rooms" class="screen">
    <div class="rooms-header">
      <button class="btn-back" onclick="goLobby()">↩</button>
      <h2>KHU VỰC</h2>
      <div class="currency-bar">
        <div class="currency gold">
          <span class="currency-icon">🪙</span>
          <span id="rooms-gold">10,000,000</span>
        </div>
        <div class="currency diamond">
          <span class="currency-icon">💎</span>
          <span id="rooms-diamond">0</span>
        </div>
      </div>
    </div>
    <div class="rooms-tabs">
      <button class="tab active" data-tab="demla" onclick="switchTab('demla')">ĐẾM LÁ</button>
      <button class="tab" data-tab="nhatat" onclick="switchTab('nhatat')">NHẤT ĂN TẤT</button>
      <button class="tab" data-tab="giaitri" onclick="switchTab('giaitri')">KHU GIẢI TRÍ</button>
    </div>
    <div class="rooms-grid" id="rooms-grid"></div>
    <div class="rooms-bottom">
      <button class="bottom-btn quick-start" onclick="quickStartFromRooms()">BẮT ĐẦU NHANH ▶</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen">
    <div class="game-top-bar">
      <button class="btn-menu" onclick="showGameMenu()">☰</button>
      <div class="game-room-info">
        <span class="room-level" id="game-level">SƠ CẤP</span>
        <span class="room-bet">Điểm Cược: <strong id="game-bet">30K</strong></span>
      </div>
      <div class="game-clock" id="game-clock">--:--</div>
    </div>

    <!-- Opponents -->
    <div class="player-slot top" id="slot-top">
      <div class="player-avatar">🤖</div>
      <div class="player-name">Bot 2</div>
      <div class="player-cards-count"><span id="count-top">13</span> lá</div>
      <div class="played-cards" id="played-top"></div>
    </div>
    <div class="player-slot left" id="slot-left">
      <div class="player-avatar">🤖</div>
      <div class="player-name">Bot 1</div>
      <div class="player-cards-count"><span id="count-left">13</span> lá</div>
      <div class="played-cards" id="played-left"></div>
    </div>
    <div class="player-slot right" id="slot-right">
      <div class="player-avatar">🤖</div>
      <div class="player-name">Bot 3</div>
      <div class="player-cards-count"><span id="count-right">13</span> lá</div>
      <div class="played-cards" id="played-right"></div>
    </div>

    <!-- Center play area -->
    <div class="play-area" id="play-area">
      <div class="game-message" id="game-message">Đếm Lá</div>
      <div class="center-cards" id="center-cards"></div>
    </div>

    <!-- Player's turn indicator -->
    <div class="turn-indicator" id="turn-indicator"></div>

    <!-- Player hand (bottom) -->
    <div class="player-hand-area">
      <div class="player-hand" id="player-hand"></div>
      <div class="hand-actions" id="hand-actions" style="display:none">
        <button class="btn-pass" id="btn-pass" onclick="playerPass()">Bỏ Lượt</button>
        <button class="btn-play" id="btn-play" onclick="playerPlay()">Đánh</button>
        <button class="btn-sort" onclick="sortHand()">Xếp</button>
      </div>
    </div>

    <!-- Player info bottom-left -->
    <div class="self-info">
      <div class="self-avatar">👤</div>
      <div class="self-name" id="self-name">Player</div>
      <div class="self-gold">🪙 <span id="self-gold">10M</span></div>
    </div>
  </div>

  <!-- GAME OVER OVERLAY -->
  <div id="game-over" class="overlay" style="display:none">
    <div class="overlay-content">
      <h2 id="game-over-title">Kết quả</h2>
      <div id="game-over-results"></div>
      <button class="btn-play" onclick="playAgain()">Chơi Lại</button>
      <button class="btn-pass" onclick="goLobby()">Về Sảnh</button>
    </div>
  </div>

  <!-- GAME MENU OVERLAY -->
  <div id="game-menu" class="overlay" style="display:none">
    <div class="overlay-content small">
      <h3>Menu</h3>
      <button class="menu-btn" onclick="closeGameMenu()">Tiếp tục</button>
      <button class="menu-btn" onclick="exitGame()">Thoát</button>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
